name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The guard CLAUDE.md documents. Root-level `client/` and `server/` have
  # existed twice as stale duplicates left over from an earlier repo layout,
  # and both times Railway and Vercel silently built the root copy instead of
  # store-app/, so real changes never reached production and nothing failed.
  # If this job goes red, the fix is almost always to merge the new file into
  # store-app/client/ or store-app/server/ and delete the root copy, not to
  # weaken this check.
  # A hook that is not executable is not a hook. Git skips it silently, prints
  # a one-line hint at most, and every commit sails through as though the guard
  # were running.
  #
  # This repo lives on a volume with core.fileMode=false, so git ignores the
  # executable bit on disk and records new files as 100644 whatever `chmod`
  # says. .githooks/pre-commit was committed that way and was inert in every
  # fresh clone, including the worktree that found this. It is exactly the
  # failure the hook itself exists to catch: looks installed, does nothing.
  #
  # Checks the mode recorded in the index, not on the runner's disk, because
  # the index is what a clone gets.
  # Extended beyond .githooks/ on 2026-08-21: backup-scheduled.sh had been
  # committed 100644 and is invoked as ./scripts/backup-scheduled.sh by the
  # nightly job, so in any fresh clone it would have failed with "permission
  # denied" the first time it mattered. Same bug, different file.
  #
  # Scoped to .sh and .githooks deliberately. Plenty of tracked .js and .py
  # files carry a shebang too, but everything runs those through `node` or
  # `python3`, so requiring the bit on them would flip fifteen files to prevent
  # nothing. A shell script with a shebang is meant to be run by path.
  executable-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if any hook or shell script is not marked executable in git
        run: |
          bad=$(git ls-files -s .githooks '*.sh' | awk '$1 != "100755" { print $4 }')
          if [ -n "$bad" ]; then
            echo "::error::Not executable in the index:"
            echo "$bad"
            echo ""
            echo "This volume has core.fileMode=false, so chmod on disk changes"
            echo "nothing that git records. Set it in the index instead:"
            for f in $bad; do echo "  git update-index --chmod=+x $f"; done
            exit 1
          fi
          echo "All hooks and shell scripts are executable."

  no-stale-root-dirs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if client/ or server/ exist at the repo root
        run: |
          stale=""
          for d in client server; do
            [ -e "$d" ] && stale="$stale $d"
          done
          if [ -n "$stale" ]; then
            echo "::error::Stale root directories present:$stale"
            echo "Canonical app code lives under store-app/. See CLAUDE.md."
            exit 1
          fi
          echo "No stale root directories."

  # THIS REPOSITORY IS PUBLIC, and scripts/backup-db.js writes every customer
  # name, phone number and order to backups/<...>.ndjson, defaulting to a path
  # inside the working tree.
  #
  # .gitignore covers those paths and .githooks/pre-commit blocks them, but
  # both are bypassable: `git add -f` ignores the first and `--no-verify`
  # ignores the second. This job is the copy that cannot be waved through,
  # which matters because publishing a customer list is the one mistake here
  # that no later commit can undo. Deleting it removes it from this repo and
  # from nowhere else: forks, mirrors and caches keep what they took.
  #
  # Scans the whole tree rather than the diff, so a snapshot that slipped in on
  # an earlier commit is caught too, not just one added today.
  no-snapshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if any database snapshot is tracked
        run: |
          found=$(git ls-files | grep -E '(^|/)backups/|\.ndjson(\.gz)?$' || true)
          if [ -n "$found" ]; then
            echo "::error::Database snapshots are tracked in this PUBLIC repository:"
            echo "$found"
            echo ""
            echo "These contain customer PII. Remove them from the index and from"
            echo "the history, then rotate anything they exposed. Write snapshots"
            echo "outside the repo: backup-db.js --out ~/QuadERP-Backups"
            exit 1
          fi
          echo "No snapshots tracked."

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: store-app/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: store-app/server/package-lock.json
      - run: npm ci
      # Supabase is mocked in these suites, so no database or secrets needed.
      - run: npx jest

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: store-app/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: store-app/client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Must run AFTER the build: it hashes dist/index.html, not the source,
      # because the build can alter the document around the inline scripts.
      #
      # Guards a trap that is otherwise invisible until production. The CSP in
      # vercel.json allows index.html's two inline scripts by SHA-256 hash, and
      # one of them sets the theme before first paint. Editing index.html by a
      # single character invalidates the hash, and once the policy is enforcing
      # the browser refuses to run that script, the app then loads as a blank
      # white page. Failing the build is a much better place to find that out.
      - run: npm run check:csp
      # supabase-js constructs a RealtimeClient whether or not anything opens a
      # channel, so realtime-js is aliased to a stub to keep ~52KB out of the
      # entry chunk. This reads the installed supabase-js bundle and fails if an
      # upgrade starts calling a method the stub lacks. setAuth is the one that
      # matters: it runs on every token refresh, so a gap breaks sign-in rather
      # than breaking realtime, and it would do so in production at runtime.
      - run: npm run check:realtime
      # The Playwright suites are deliberately not run here: they need a
      # browser, the visual project is serialised (~6 min), and its baselines
      # are captured on a specific machine, so pixel comparison across runners
      # would fail for reasons unrelated to the code.
